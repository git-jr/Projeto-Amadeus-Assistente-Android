plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.paradoxo.amadeus'
    compileSdk 36

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId "com.paradoxo.amadeus"
        minSdk 23
        targetSdk 36
        versionCode 394
        versionName "3.0.0 | Agent Alpha 1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "FORCE_PREMIUM_FOR_TESTS", "false"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "FORCE_PREMIUM_FOR_TESTS", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            debuggable true
            buildConfigField "boolean", "FORCE_PREMIUM_FOR_TESTS", "true"
        }
    }

    sourceSets {
        main {
            java {
                exclude '**/*Java.java'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.google.android.material:material:1.12.0'

    // Room
    def room_version = "2.7.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jsoup:jsoup:1.18.1'

    implementation 'com.google.guava:guava:33.3.1-android'

    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'joda-time:joda-time:2.13.0'
    implementation 'com.airbnb.android:lottie:6.6.0'

    implementation 'com.google.android.gms:play-services-oss-licenses:17.1.0'

    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // Firebase AI Logic (replaces standalone generativeai SDK)
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-functions'

    // Vosk (wake word detection, offline)
    implementation 'com.alphacephei:vosk-android:0.3.75'

    // LiteRT-LM (on-device local LLM inference)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.03.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.2.0'
}

secrets {
    propertiesFileName = 'local.properties'
    defaultPropertiesFileName = 'secrets.defaults.properties'
    ignoreList.add("sdk.dir")
}

// Grant accessibility permission via ADB for debug builds
tasks.register('grantAccessibility', Exec) {
    group = 'development'
    description = 'Grant accessibility permission via ADB (debug only)'
    def pkg = 'com.paradoxo.amadeus'
    def svc = "${pkg}/${pkg}.service.AmadeusAccessibilityService"
    commandLine 'sh', '-c',
        "adb shell settings put secure enabled_accessibility_services \"$svc\" && " +
        "adb shell settings put secure accessibility_enabled 1"
}

tasks.configureEach { task ->
    if (task.name == 'installDebug') {
        task.finalizedBy 'grantAccessibility'
    }
}
